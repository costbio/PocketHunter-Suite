[alembic]
# Migration scripts directory, relative to this file.
script_location = alembic

# Use a single, sortable file naming scheme that survives sql-init reordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration filenames (UTC keeps history portable).
timezone = UTC

# DATABASE_URL is read from the environment at runtime via env.py.
# Leave this blank; do not commit credentials to the repo.
sqlalchemy.url =

[post_write_hooks]
# (intentionally empty — no autoformatter yet)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
