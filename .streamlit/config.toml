# Brutalist scientific theme — JetBrains Mono, B&W, acid yellow accent
# Zero radius, hard 2px-equivalent borders, no shadows.

[server]
# v2 Phase B B3: serve files placed in ``./static/`` at ``/app/static/...``
# so the Mol* component can fetch per-session viewer.cif by URL.
enableStaticServing = true

[browser]
# Streamlit posts anonymous usage telemetry to webhooks.fivetran.com by
# default. That is a third-party request made from every visitor's
# browser, which the NAR Web Server Issue rules out and which contradicts
# this service's own privacy statement — the help page tells readers that
# no page here contacts a third party. Caught by a runtime request trace
# after deploy; static HTML scanning cannot see it, because Streamlit's
# own bundle issues it.
gatherUsageStats = false

[theme]
base = "light"

primaryColor = "#000000"             # Buttons: black bg, white text — peak brutalist
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#000000"
linkColor = "#000000"
borderColor = "#000000"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
linkUnderline = true

# Family name only — no URL. The @font-face rules are injected inline by
# main.py instead, because Streamlit silently ignored a root-relative
# stylesheet URL here: it fetched nothing, registered no face, and fell
# back to Source Sans. Silently, which is the dangerous part — the app
# still looked right on any machine with JetBrains Mono installed
# locally, and wrong for everyone else.
#
# (These pointed at fonts.googleapis.com until 2026-08-16. That sent
# every visitor's IP to a third party before our own content rendered,
# which the NAR Web Server Issue rules out.)
font = "JetBrains Mono"
headingFont = "JetBrains Mono"
codeFont = "JetBrains Mono"
codeFontSize = "13px"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "15px", "13px", "12px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]

# Semantic palette — preserve status legibility, but harsh
redColor = "#cc0000"
greenColor = "#000000"
yellowColor = "#d4ff00"
yellowBackgroundColor = "#d4ff00"
yellowTextColor = "#000000"
orangeColor = "#000000"
blueColor = "#000000"
violetColor = "#000000"
grayColor = "#666666"

chartCategoricalColors = ["#000000", "#d4ff00", "#666666", "#cc0000", "#999999", "#333333", "#cccccc"]

# Dataframe — black borders, but keep header readable
dataframeBorderColor = "#000000"
dataframeHeaderBackgroundColor = "#f4f4f4"

[theme.sidebar]
backgroundColor = "#f4f4f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#000000"
borderColor = "#000000"
primaryColor = "#000000"
