services:
  redis:
    image: redis:7-alpine
    container_name: pockethunter-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pockethunter-postgres
    environment:
      - POSTGRES_USER=pockethunter
      - POSTGRES_PASSWORD=pockethunter
      - POSTGRES_DB=pockethunter
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pockethunter -d pockethunter"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      network: host
    container_name: pockethunter-celery
    command: celery -A celery_app worker -Q default,celery --concurrency=${WORKER_CONCURRENCY:-8} --loglevel=info
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://pockethunter:pockethunter@postgres:5432/pockethunter
      - BASE_URL=http://localhost:8511
      - PYTHONPATH=/app
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
      - DOCKING_CONCURRENCY=${DOCKING_CONCURRENCY:-4}
      - P2RANK_THREADS=${P2RANK_THREADS:-4}
      - DOCKING_EXHAUSTIVENESS=${DOCKING_EXHAUSTIVENESS:-8}
      - DOCKING_MAX_PAIRS=${DOCKING_MAX_PAIRS:-1000}
      - MAX_DOWNLOAD_ZIP_SIZE=${MAX_DOWNLOAD_ZIP_SIZE:-536870912}
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped

  celery-docking-worker:
    build:
      context: .
      network: host
    container_name: pockethunter-celery-docking
    command: celery -A celery_app worker -Q docking --concurrency=${DOCKING_CONCURRENCY:-4} --loglevel=info
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://pockethunter:pockethunter@postgres:5432/pockethunter
      - BASE_URL=http://localhost:8511
      - PYTHONPATH=/app
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
      - DOCKING_CONCURRENCY=${DOCKING_CONCURRENCY:-4}
      - P2RANK_THREADS=${P2RANK_THREADS:-4}
      - DOCKING_EXHAUSTIVENESS=${DOCKING_EXHAUSTIVENESS:-8}
      - DOCKING_MAX_PAIRS=${DOCKING_MAX_PAIRS:-1000}
      - MAX_DOWNLOAD_ZIP_SIZE=${MAX_DOWNLOAD_ZIP_SIZE:-536870912}
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      network: host
    container_name: pockethunter-beat
    command: celery -A celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://pockethunter:pockethunter@postgres:5432/pockethunter
      - BASE_URL=http://localhost:8511
    volumes:
      - .:/app
    restart: unless-stopped

  streamlit:
    build:
      context: .
      network: host
    container_name: pockethunter-streamlit
    command: streamlit run main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8511:8501"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://pockethunter:pockethunter@postgres:5432/pockethunter
      - BASE_URL=http://localhost:8511
      - DOCKING_EXHAUSTIVENESS=${DOCKING_EXHAUSTIVENESS:-8}
      - DOCKING_MAX_PAIRS=${DOCKING_MAX_PAIRS:-1000}
      - MAX_DOWNLOAD_ZIP_SIZE=${MAX_DOWNLOAD_ZIP_SIZE:-536870912}
      - P2RANK_THREADS=${P2RANK_THREADS:-4}
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./logs:/app/logs
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
  pgdata:
